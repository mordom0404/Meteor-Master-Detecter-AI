version: 2
updates:
  # Python 依赖：每周检查一次运行时依赖
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 训练 / 导出用重量级包，不参与引擎运行时
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "ultralytics*"
      - dependency-name: "nvidia-*"

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
